<VirtualHost *:443>
    ServerName inventaris.example.com
    DocumentRoot /var/www/inventory-mvc/public

    <Directory /var/www/inventory-mvc/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/inventaris.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/inventaris.example.com/privkey.pem
</VirtualHost>
